name: Build QEMU 8.2.5 (AArch64) for Android

on:
  workflow_dispatch:

jobs:
  build-qemu:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 안드로이드 SDK 및 NDK 세팅
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546

      - name: 3. NDK (r25c) 설치
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: 4. 필수 빌드 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-pip \
            ninja-build \
            pkg-config \
            flex \
            bison \
            meson

      - name: 5. GLib / Pixman / Pcre2 안드로이드용 소스 컴파일 및 NDK Sysroot에 설치
        run: |
          export NDK=$ANDROID_HOME/ndk/25.2.9519653
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=29
          export SYSROOT=$TOOLCHAIN/sysroot
          
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib

          mkdir -p deps && cd deps

          # 1) Pixman 소스 빌드
          wget https://cgit.freedesktop.org/pixman/snapshot/pixman-0.42.2.tar.gz
          tar -xf pixman-0.42.2.tar.gz && cd pixman-0.42.2
          mkdir build && cd build
          meson setup .. \
            --cross-file <(cat <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          ld = '$LD'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
          ) \
            --prefix=$SYSROOT/usr \
            --default-library=static
          ninja && ninja install
          cd ../..

          # 2) PCRE2 소스 빌드 (GLib 필수 의존성)
          wget https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.42/pcre2-10.42.tar.gz
          tar -xf pcre2-10.42.tar.gz && cd pcre2-10.42
          ./configure --host=$TARGET --prefix=$SYSROOT/usr --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # 3) GLib 소스 빌드
          wget https://download.gnome.org/sources/glib/2.78/glib-2.78.4.tar.xz
          tar -xf glib-2.78.4.tar.xz && cd glib-2.78.4
          mkdir build && cd build
          meson setup .. \
            --cross-file <(cat <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          ld = '$LD'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
          ) \
            --prefix=$SYSROOT/usr \
            --default-library=static \
            -Dtests=false \
            -Dlibmount=disabled
          ninja && ninja install
          cd ../../../

      - name: 6. QEMU 8.2.5 소스코드 다운로드
        run: |
          wget https://download.qemu.org/qemu-8.2.5.tar.xz
          tar -xf qemu-8.2.5.tar.xz

      - name: 7. QEMU (aarch64-softmmu) 안드로이드 크로스 컴파일
        run: |
          cd qemu-8.2.5
          
          export NDK=$ANDROID_HOME/ndk/25.2.9519653
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=29
          export SYSROOT=$TOOLCHAIN/sysroot
          
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          # NDK Sysroot에 설치된 pkgconfig 경로 전달
          export PKG_CONFIG_PATH=$SYSROOT/usr/lib/aarch64-linux-android/pkgconfig:$SYSROOT/usr/share/pkgconfig:$SYSROOT/usr/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=$PKG_CONFIG_PATH
          export CFLAGS="-I$SYSROOT/usr/include"
          export LDFLAGS="-L$SYSROOT/usr/lib -L$SYSROOT/usr/lib/aarch64-linux-android"

          # Meson 용 Cross File 생성
          cat <<EOF > android.cross
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          ld = '$LD'
          strip = '$STRIP'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

          ./configure \
            --cross-prefix=${TARGET}- \
            --target-list=aarch64-softmmu \
            --meson=meson \
            --extra-cflags="$CFLAGS" \
            --extra-ldflags="$LDFLAGS" \
            --disable-gtk \
            --disable-glusterfs \
            --disable-libiscsi \
            --disable-slirp \
            --static
            
          make -j$(nproc)

      - name: 8. 빌드 결과물 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: qemu-8.2.5-android-aarch64
          path: |
            qemu-8.2.5/build/qemu-system-aarch64
            qemu-8.2.5/build/qemu-img

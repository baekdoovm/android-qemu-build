name: Build QEMU 8.2.5 (AArch64) for Android

on:
  workflow_dispatch:

jobs:
  build-qemu:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 안드로이드 SDK 및 NDK 세팅
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546

      - name: 3. NDK (r25c) 설치
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: 4. 빌드 필수 호스트 패키지 및 zstd 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-pip \
            ninja-build \
            pkg-config \
            flex \
            bison \
            zstd \
            apt-utils

      - name: 5. Termux 최신 GLib 및 Pixman 패키지 다운로드 및 NDK 주입
        run: |
          export NDK=$ANDROID_HOME/ndk/25.2.9519653
          export SYSROOT=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          
          mkdir -p termux_deps && cd termux_deps
          
          # Termux APT 저장소 인덱스 다운로드 후 최신 deb 경로 파싱
          curl -sL https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz | xz -d > Packages
          
          GLIB_URL=$(grep -A 10 "Package: glib" Packages | grep "Filename:" | head -n 1 | awk '{print $2}')
          PIXMAN_URL=$(grep -A 10 "Package: libpixman" Packages | grep "Filename:" | head -n 1 | awk '{print $2}')
          ICONV_URL=$(grep -A 10 "Package: libiconv" Packages | grep "Filename:" | head -n 1 | awk '{print $2}')
          PCRE2_URL=$(grep -A 10 "Package: pcre2" Packages | grep "Filename:" | head -n 1 | awk '{print $2}')
          
          wget "https://packages.termux.dev/apt/termux-main/$GLIB_URL" -O glib.deb
          wget "https://packages.termux.dev/apt/termux-main/$PIXMAN_URL" -O pixman.deb
          wget "https://packages.termux.dev/apt/termux-main/$ICONV_URL" -O iconv.deb
          wget "https://packages.termux.dev/apt/termux-main/$PCRE2_URL" -O pcre2.deb
          
          # deb 압축 해제 (xz 및 zstd 지원)
          for deb in *.deb; do
            ar x "$deb"
            if [ -f data.tar.xz ]; then
              tar -xf data.tar.xz
            elif [ -f data.tar.zst ]; then
              tar --zstd -xf data.tar.zst
            fi
          done
          
          # Header 및 Libs를 NDK sysroot로 복사
          cp -r data/data/com.termux/files/usr/include/* $SYSROOT/usr/include/
          cp -r data/data/com.termux/files/usr/lib/* $SYSROOT/usr/lib/aarch64-linux-android/
          
          cd ..

      - name: 6. QEMU 8.2.5 소스코드 다운로드
        run: |
          wget https://download.qemu.org/qemu-8.2.5.tar.xz
          tar -xf qemu-8.2.5.tar.xz

      - name: 7. Android ARM64용 QEMU 크로스 컴파일
        run: |
          cd qemu-8.2.5
          
          export NDK=$ANDROID_HOME/ndk/25.2.9519653
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=29
          
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          export PKG_CONFIG_PATH=$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/pkgconfig
          export PKG_CONFIG_LIBDIR=$PKG_CONFIG_PATH
          
          ./configure \
            --cross-prefix=${TARGET}- \
            --target-list=aarch64-softmmu \
            --disable-gtk \
            --disable-glusterfs \
            --disable-libiscsi \
            --disable-slirp \
            --static
            
          make -j$(nproc)

      - name: 8. 빌드 결과물 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: qemu-8.2.5-android-aarch64
          path: |
            qemu-8.2.5/build/qemu-system-aarch64
            qemu-8.2.5/build/qemu-img

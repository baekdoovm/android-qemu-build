name: Build QEMU 8.2.5 (AArch64) for Android

on:
  workflow_dispatch:

jobs:
  build-qemu:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 안드로이드 SDK 및 NDK 세팅
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546

      - name: 3. NDK (r25c) 설치
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: 4. 빌드 필수 호스트 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-pip \
            ninja-build \
            pkg-config \
            flex \
            bison

      - name: 5. Termux 안드로이드용 Prebuilt GLib & Pixman 다운로드 및 NDK 주입
        run: |
          export NDK=$ANDROID_HOME/ndk/25.2.9519653
          export SYSROOT=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          
          mkdir -p termux_deps && cd termux_deps
          
          # Termux 저장소에서 안드로이드 aarch64용 glib, pixman, iconv, pcre2 deb 패키지 받기
          wget https://packages.termux.dev/apt/termux-main/pool/main/g/glib/glib_2.78.4_aarch64.deb
          wget https://packages.termux.dev/apt/termux-main/pool/main/p/pixman/libpixman_0.42.2-1_aarch64.deb
          wget https://packages.termux.dev/apt/termux-main/pool/main/l/libiconv/libiconv_1.17-1_aarch64.deb
          wget https://packages.termux.dev/apt/termux-main/pool/main/p/pcre2/pcre2_10.42-1_aarch64.deb
          wget https://packages.termux.dev/apt/termux-main/pool/main/gettext/libandroid-glob_1.0_aarch64.deb
          
          # 압축 풀어서 NDK sysroot 디렉토리에 강제 주입
          for deb in *.deb; do
            ar x "$deb"
            tar -xf data.tar.xz
          done
          
          # Header 및 Libs를 NDK sysroot로 복사
          cp -r data/data/com.termux/files/usr/include/* $SYSROOT/usr/include/
          cp -r data/data/com.termux/files/usr/lib/* $SYSROOT/usr/lib/aarch64-linux-android/
          
          cd ..

      - name: 6. QEMU 8.2.5 소스코드 다운로드
        run: |
          wget https://download.qemu.org/qemu-8.2.5.tar.xz
          tar -xf qemu-8.2.5.tar.xz

      - name: 7. Android ARM64용 QEMU 크로스 컴파일
        run: |
          cd qemu-8.2.5
          
          export NDK=$ANDROID_HOME/ndk/25.2.9519653
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=29
          
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          # Meson 크로스 파일 대신 pkg-config 검색 경로를 NDK sysroot로 고정
          export PKG_CONFIG_PATH=$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/pkgconfig
          export PKG_CONFIG_LIBDIR=$PKG_CONFIG_PATH
          
          ./configure \
            --cross-prefix=${TARGET}- \
            --target-list=aarch64-softmmu \
            --disable-gtk \
            --disable-glusterfs \
            --disable-libiscsi \
            --disable-slirp \
            --static
            
          make -j$(nproc)

      - name: 8. 빌드 결과물 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: qemu-8.2.5-android-aarch64
          path: |
            qemu-8.2.5/build/qemu-system-aarch64
            qemu-8.2.5/build/qemu-img
